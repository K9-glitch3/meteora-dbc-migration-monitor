name: Verify monitor
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - run: npm audit --audit-level=low
      - run: node scripts/check_bigint.cjs
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_evidence.py
      - run: node --check docs/explorer.js
      - run: node --check docs/monitor.js
      - run: node --check docs/quotes.js
      - run: python scripts/check_pilot.py
      - run: python -m dbc_monitor aggregate evidence/stream_vs_chain_20261001.json
      - name: Verify installable package
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Verify installed package outside source import path
        run: python -I -m dbc_monitor verify evidence/synthetic-v1
